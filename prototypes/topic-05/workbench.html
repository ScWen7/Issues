<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>订单项目 · 协作工作台</title>
<style>
:root{color-scheme:light;--ink:#212524;--sub:#555d59;--line:#dedfd8;--paper:#fff;--base:#f5f5f0;--accent:#255a48;--accent-bg:#e8f0ea;--warn:#794e19;--warn-bg:#fff4dc;--error:#943f38;--error-bg:#f7e9e5}
*{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--ink);font:15px/1.65 "Inter","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
button,select{font:inherit} button,select,summary,a{touch-action:manipulation} button,select{min-height:38px;border:1px solid #cecfc7;background:var(--paper);color:var(--ink);border-radius:5px;padding:5px 12px} button,select,summary{cursor:pointer}button:hover:not(:disabled),select:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #337e63;outline-offset:3px}button:disabled{background:#ededeb;color:#626660;cursor:not-allowed}a{color:var(--accent);text-underline-offset:3px}
header{background:#fff;border-bottom:1px solid var(--line)}.top{max-width:1180px;margin:auto;padding:13px 35px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:700;letter-spacing:.025em;font-size:17px}.brand span{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:8px;background:var(--accent);color:white;border-radius:5px;font-size:14px}.switcher{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px}.switcher select{font-size:14px}select{max-width:100%}.layout{max-width:1180px;margin:auto;padding:35px;display:grid;grid-template-columns:minmax(0,1fr) 260px;align-items:start;gap:26px}.intro{margin:0 0 21px}.intro h1{font-size:clamp(27px,4vw,39px);letter-spacing:-.045em;line-height:1.25;margin:5px 0 9px}.intro p,.muted{color:var(--sub)}.intro p{margin:0}.crumb{font-size:13px;color:var(--sub);margin:0 0 10px}.crumb button{border:0;padding:0;min-height:28px;background:none;text-decoration:underline;text-underline-offset:3px;color:var(--accent)}aside{margin-top:3px;border-top:3px solid var(--ink);padding-top:14px}aside h2{margin:0 0 14px;font-size:17px}aside dl{margin:0}aside dt{font-size:12px;color:var(--sub);margin-top:12px}aside dd{margin:0;font-size:14px}aside p{font-size:14px}aside hr{border:0;border-top:1px solid var(--line);margin:18px 0}.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:19px 21px;margin:0 0 14px}.panel h2{margin:0 0 12px;font-size:18px}.panel h3{font-size:15px;margin:0 0 6px}.panel p{margin:6px 0}.panel ul,.panel ol{padding-left:22px}.panel li{margin:7px 0}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.bar h2{margin-bottom:0}.subhead{font-size:12px;color:var(--sub);letter-spacing:.06em;font-weight:600}.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:#eeeee8;color:#444a43;white-space:nowrap}.status:before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}.warn{color:var(--warn);background:var(--warn-bg)}.bad{color:var(--error);background:var(--error-bg)}.ok{color:var(--accent);background:var(--accent-bg)}.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:600}.primary:hover:not(:disabled){background:#194735}.entry{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;text-align:left;padding:14px 0;border:0;border-radius:0;border-top:1px solid var(--line);align-items:center}.entry:first-of-type{margin-top:14px}.entry strong{font-size:16px}.entry small{grid-column:1/-1;color:var(--sub);font-size:13px}.entry:hover:not(:disabled){background:#f6f8f3}.action{border-left:3px solid var(--accent)}.action p{margin:8px 0 12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.tabs [aria-pressed=true]{background:#233f35;border-color:#233f35;color:#fff}.check{display:grid;grid-template-columns:minmax(92px,auto) 1fr auto;align-items:start;gap:11px;border-top:1px solid var(--line);padding:9px 0;font-size:13px}.check strong{white-space:nowrap}.check .status{align-self:start}summary{font-weight:600;padding:3px 0}.record{font-size:13px;overflow-wrap:anywhere}.record code{font:12px/1.5 "IBM Plex Mono",monospace}.notes{color:var(--sub);font-size:13px}.diff{display:flex;gap:12px;align-items:center;font-size:17px}.notice{color:var(--accent);font-weight:600;font-size:14px}.footer{max-width:1180px;padding:5px 35px 34px;color:var(--sub);font-size:12px;margin:auto}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:790px){.layout{grid-template-columns:1fr;gap:5px;padding:22px 16px}.top{padding:12px 16px}.footer{padding:4px 16px 22px}.panel{padding:15px}.check{grid-template-columns:minmax(75px,auto) 1fr}.check .status{grid-column:2;width:max-content}.switcher{gap:5px}.entry{gap:4px}.intro h1{font-size:28px}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><span aria-hidden="true">协</span>协作工作台</div><div class="switcher"><label for="role">演练身份</label><select id="role"><option value="lin">林 · 产品与验收</option><option value="jia">甲 · 后端开发</option><option value="bing">丙 · 独立验证</option></select><button id="reset" type="button">重置演练</button></div></div></header>
<noscript><style>.layout,.top .switcher{display:none}</style><section class="panel" style="max-width:780px;margin:32px auto"><h1>订单批量导出</h1><p>工作约定 D2 要求导出当前筛选下的可见订单，付款时间按上海时区展示。C1 的东区工作簿混入西区订单 B-201，A2 权限失败。C2 在同一 D2 下修复，A2 与 A3 内容检查均通过。</p><p>当前资料还缺 A1 范围、A4 边界、A5 交互和 A6 候选关联的 UAT。当前负责人是交付 Squad，指定验收人是林。</p><p>下载 HTML 后在启用 JavaScript 的浏览器打开，可切换角色、查通知及演练接受或退回。</p></section></noscript>
<div id="notification" class="sr" role="status" aria-live="polite"></div>
<div class="layout"><main id="main"></main><aside id="aside" aria-label="工作属性"></aside></div>
<footer class="footer">专题五交互原型 · 合成订单与模拟身份。操作仅影响此页面，刷新后恢复初始演练。</footer>
<script>
"use strict";
const main = document.getElementById("main");
const aside = document.getElementById("aside");
const people = {lin:"林",jia:"甲",bing:"丙"};
const recordsBase = "https://github.com/ScWen7/Issues/blob/fca5dced21af6ed2525184a45ff14148866df35d/";
const reports = {
  C1:{run:"verify-C1",commit:"6880625de52ceb834e3e60b07cd8748c4ad79058",hash:"da022445c03fa787af994101f47cd8cfb777913f882a6b7aa32116a3493afcb1"},
  C2:{run:"verify-C2",commit:"005e558ad99a6def3f4dbb2c7a1ec56e71553bf7",hash:"e9c93051c5b844cf23aa89061eed967c5a2267e846e26b37ece7275f194bd514"}
};
function initial(){return {page:"project",role:"lin",repaired:false,full:false,accepted:false,returned:null,reason:"",read:{},openedNotice:null,selected:"C1",lightOwner:null,lightDone:false};}
let state=initial();
const pill=(text,tone="")=>'<span class="status '+tone+'">'+text+'</span>';
const panel=(title,body)=>'<section class="panel"><h2>'+title+'</h2>'+body+'</section>';
const button=(label,action,cls="",disabled=false)=>'<button type="button" class="'+cls+'" data-action="'+action+'"'+(disabled?" disabled":"")+'>'+label+'</button>';
const intro=(title,desc)=>'<div class="intro"><div class="crumb">'+(state.page==="project"?"项目 / 订单系统":button("订单项目","project")+' / Issue')+'</div><h1 id="heading" tabindex="-1">'+title+'</h1><p>'+desc+'</p></div>';
const dl=(pairs)=>'<dl>'+pairs.map(([term,value])=>'<dt>'+term+'</dt><dd>'+value+'</dd>').join("")+'</dl>';
const row=(title,status,detail,action,tone="")=>'<button class="entry" type="button" data-action="'+action+'"><strong>'+title+'</strong>'+pill(status,tone)+'<small>'+detail+'</small></button>';
const returnCriteria={uat:"A6 交付",spec:"A5 交互"};
const returnReasons={uat:"A6：演练 UAT 使用的候选与 C2 不符，需重新核对。",spec:"A5：演练中的失败重试表现有缺口，需补充操作证据。"};
function notices(){
  const items=[{id:"failure",candidate:"C1",title:"C1 区域核验未通过",detail:"查看独立验证结果与后端返工依据。"}];
  if(state.full&&state.role==="lin")items.unshift({id:"review",candidate:"C2",title:"C2 交付验收",detail:state.returned?"已退回，本轮决定已记录。":state.accepted?"已由林接受交付。":"交付 Squad 已向林提交当前候选。"});
  if(state.returned&&state.role==="jia")items.unshift({id:"returned",candidate:"C2",title:"C2 已退回交付 Squad",detail:state.returned.reason});
  return items;
}
function visibleNotice(id){return notices().find(item=>item.id===id);}
function inbox(){
  const rows=notices().map(item=>{
    const isRead=state.read[state.role+"-"+item.id];
    return row(item.title,isRead?"已读":"未读",item.detail,"notice-"+item.id,isRead?"":"warn");
  });
  return panel("我的通知 · "+people[state.role],rows.join(""));
}
function orderStatus(){if(state.returned)return "已退回 Squad";if(state.accepted)return "已接受交付";if(state.full)return "等待林验收";if(state.repaired)return "待补验收依据";return "验证失败";}
function project(){
  const orderDesc=state.returned?"林已记录 C2 的退回理由，当前由交付 Squad 接续。":state.accepted?"C2 的交付决定已记录。":state.full?"C2 已交回林，等待具名决定。":state.repaired?"C2 的 A2、A3 通过，待补其他证据。":"C1 越过订单可见范围，交付 Squad 负责返工。";
  const small=state.lightOwner?row("修改导出按钮文案",state.lightDone?"已接受":"待接受","当前候选显示“批量导出”；由 "+people[state.lightOwner]+" 核对。","light",state.lightDone?"ok":"warn"):"";
  main.innerHTML=intro("订单项目","工作事项、当前负责人和下一步。")+'<section class="panel"><div class="bar"><h2>项目工作</h2>'+button(state.lightOwner?"打开轻量事项":"创建轻量事项","light","primary")+'</div>'+
    row("订单批量导出",orderStatus(),orderDesc,"order",state.accepted?"ok":state.repaired?"warn":"bad")+small+
    row("导出兼容性调查","资源排队","独立资源情景：订单协调占用共享 Leader Runtime 的唯一槽位。","capacity","warn")+'</section>'+inbox();
  aside.innerHTML='<h2>工作范围</h2>'+dl([["项目","订单系统"],["当前查看人",people[state.role]],["业务验收","订单批量导出 → 林"]])+'<hr><p>打开事项查看当前的工作约定、候选及下一步。</p>';
}
function allowedToAccept(){return state.role==="lin"&&state.repaired&&state.full&&!state.returned&&!state.accepted&&state.selected==="C2";}
function acceptanceReason(){
  if(state.selected==="C1")return state.repaired?"C1 已被 C2 取代，保留原结果供追溯。":"C1 的 A2 未通过，等待后端修复和独立重验。";
  if(state.returned)return "林已退回本轮 C2。"+state.returned.reason+" 交付 Squad 需重新提交有效交付轮次。";
  if(!state.full)return "C2 尚缺 A1、A4、A5 与 A6 的完整验收依据。交付 Squad 的 Leader 牵头补证，丙协调独立验证。交付材料齐备后，林在 A6 核对当前候选和获准 UAT，再作验收决定。";
  if(state.accepted)return "林已按 D2 接受 C2。父 Issue 已完成。";
  if(state.role!=="lin")return "林是指定验收人。其他成员可以核对报告，验收决定由林提交。";
  return "父 Issue 已交回林。请核对演练中的 UAT 记录和 D2 标准后接受 C2。";
}
function acceptanceRows(){
  const isC2=state.selected==="C2", complete=isC2&&state.full;
  const optional=(sample)=>complete?[sample,"演练证据","ok"]:["等待本候选对应依据","缺项","warn"];
  const items=[
    ["A1 范围",...optional("分页筛选检查记录与预期订单集合一致。")],
    ["A2 权限",isC2?"东区仅 A-101、A-102；西区、跨区和只读角色对照正确。":"东区工作簿多出西区订单 B-201。",isC2?"记录通过":"记录失败",isC2?"ok":"bad"],
    ["A3 内容","按上海时区回读付款时间，未付款订单留空，金额与预期一致。","记录通过","ok"],
    ["A4 数量",...optional("5,000 条成功，5,001 条按约定拒绝。")],
    ["A5 交互",...optional("空结果、加载、失败重试与重复点击均已逐项核对。")],
    ["A6 交付",...optional("独立审查与 UAT 均指向 C2；交付说明随同该候选。")]
  ];
  return items.map(([id,detail,status,tone])=>{
    if(isC2 && state.returned?.criterion===id){
      return '<div class="check"><strong>'+id+'</strong><div>'+state.returned.reason+'<details><summary>退回前提交的演练材料</summary><p>'+detail+'</p></details></div>'+pill("人工有异议 · 待补验","warn")+'</div>';
    }
    return '<div class="check"><strong>'+id+'</strong><span>'+detail+'</span>'+pill(status,tone)+'</div>';
  }).join("");
}
function sourceRecord(){
  const key=state.selected,r=reports[key];
  const url=recordsBase+"docs/research/topic-03a/fixtures/order-export-"+key.toLowerCase()+".json";
  return '<details class="panel record"><summary>查看 '+key+' 的实验原始记录</summary>'+dl([
    ["验证 Run",r.run],["候选提交",'<code>'+r.commit+'</code>'],["独立报告 SHA-256",'<code>'+r.hash+'</code>'],
    ["工作副本证据",'<a href="'+url+'" target="_blank" rel="noreferrer">打开固定提交中的 JSON 报告 ↗</a>']
  ])+'<p>合成订单实验覆盖 A2 与 A3。其余检查和 UAT 的演练材料在原型中单独标注。</p></details>';
}
function order(){
  const selected=state.selected;
  const actor=state.full&&!state.returned?"林":"交付 Squad";
  const notice=state.openedNotice&&visibleNotice(state.openedNotice);
  let noticeText="";
  if(notice){
    const stale=notice.candidate==="C1"&&state.repaired;
    const related=stale?"这条通知引用历史 C1，当前工作已进入 C2。":notice.id==="review"?"打开通知已记为已读，验收决定见本 Issue。":"通知已读，可在此查看对应报告和处理进度。";
    noticeText='<p class="notice">'+related+(stale?" "+button("查看当前 C2","C2"):"")+'</p>';
  }
  let returnForm="";
  if(allowedToAccept()){
    const options=Object.entries(returnReasons).map(([key,value])=>'<option value="'+key+'"'+(key===state.reason?' selected':'')+'>'+value+'</option>').join("");
    returnForm='<details style="margin-top:13px"><summary>退回交付 Squad</summary><p class="notes">选择本次验收演练中发现的缺口。退回后原报告与决定仍可追溯。</p><label for="return-reason">退回理由</label> <select id="return-reason"><option value="">选择本次发现</option>'+options+'</select> '+button("记录并退回","return","",!state.reason)+'</details>';
  }
  const action=state.accepted||state.returned?"":button("接受 "+selected+" 交付","accept","primary",!allowedToAccept());
  main.innerHTML=intro("订单批量导出","按当前筛选导出全部可见订单，使用 XLSX 交付。")+noticeText+
  '<section class="panel action"><div class="bar"><h2>当前工作</h2>'+pill(orderStatus(),state.accepted?"ok":state.repaired?"warn":"bad")+'</div><p>'+acceptanceReason()+'</p>'+action+returnForm+'</section>'+
  '<section class="panel"><div class="bar"><h2>交付候选与验收依据</h2><span class="subhead">工作约定 D2</span></div><div class="tabs" aria-label="检查候选">'+
    ['C1',...(state.repaired?['C2']:[])].map(k=>'<button type="button" data-action="'+k+'" aria-pressed="'+(selected===k)+'">'+k+(k==="C1"&&state.repaired?" · 历史":k==="C2"&&state.returned?" · 已退回":" · 当前")+'</button>').join("")+
  '</div>'+acceptanceRows()+'</section>'+sourceRecord()+
  '<details class="panel"><summary>协作过程与决定</summary><ol><li>林提出目标并确认 D1。交付 Squad 负责实施，Leader 在父 Issue 安排前后端并行。</li><li>林确认 D2，在原有规则上增加付款时间列，未付款留空，按上海时区展示。</li><li>独立验证成员丙提交 C1 报告，A2 失败，后端子项定向返工。</li>'+
  (state.repaired?'<li>原集成子项提交 C2，丙按原 D2 重验。C1 的失败记录保留。</li>':'')+
  (state.full?'<li>演练：补齐其余依据并核对 C2 的授权 UAT，Squad 将父 Issue 交还林。</li>':'')+
  (state.returned?'<li><strong>演练退回决定：</strong>林 · C2 / D2 / A1–A6。'+state.returned.reason+' 本轮已结束，父 Issue 当前负责人已交回交付 Squad。</li>':'')+
  (state.accepted?'<li><strong>演练决定：</strong>林接受 C2，依据 D2 的 A1–A6 和当前交付记录。</li>':'')+'</ol></details>'+
  (state.accepted?panel("交付后追踪",'<p>本订单的原生费用为未知。失败与复验各归其实际 Run。</p><p>演练改进提案：将区域与跨区账号加入固定回归样本。候选仍待 Benchmark 和发布审核。</p>'):"");
  let move=state.repaired?(state.full?"":button("载入完整验收演练条件","full")):button("查看修复后的 C2","repair");
  let hint=state.repaired?"载入后补入 A1、A4、A5 的合成检查和 A6 的 C2 审查、UAT 记录，并将父 Issue 交给林。":"推进到固定实验记录中的 C2。该动作只切换走查情景。";
  aside.innerHTML='<h2>工作属性</h2>'+dl([["当前负责人",actor],["人工总责人","林"],["指定验收人","林"],["独立验证","丙"],["本次检查候选",state.selected],["当前交付轮次",state.returned?"C2 本轮已退回":state.repaired?"C2":"C1"]])+
  (move?'<hr><h2>演练控制</h2><p>'+hint+'</p>'+move:"");
}
function light(){
  const existing=state.lightOwner!==null;
  const owner=people[state.lightOwner]||people[state.role];
  main.innerHTML=intro(existing?"修改导出按钮文案":"创建轻量事项","同一 Issue 上完成文案修改和结果确认。")+
  (existing?panel("交付候选",'<div class="diff"><del>导出</del><span>→</span><strong>批量导出</strong></div><p>演练回执：执行 Agent 已提交修改，并在订单页面检查了实际显示。</p>'):
    panel("工作约定",'<p>把导出按钮文案改为“批量导出”，并检查订单页面的实际显示。</p><p>项目已有授权和可用 Runtime。执行 Agent 按项目默认安排，总责与接受由创建成员承担。</p>'))+
  '<section class="panel action"><h2>'+(!existing?"创建与开始":state.lightDone?"已接受":"接受结果")+'</h2><p>'+(!existing?"一次提交即创建工作并安排执行。":state.lightDone?owner+" 已确认交付，记录保留在此 Issue。":owner+" 查看显示结果后确认接受。")+'</p>'+
  (!existing?button("创建并开始","createLight","primary"):state.lightDone?"":button("查看并接受","acceptLight","primary",state.lightOwner!==state.role))+'</section>';
  aside.innerHTML='<h2>轻量路径</h2>'+dl([["执行安排","项目默认 Agent"],["指定接受人",owner],["已提交的业务动作",state.lightDone?"2 / 2":existing?"1 / 2":"0 / 2"]]);
}
function condition(){
  const capacity=state.page==="capacity";
  main.innerHTML=intro("导出兼容性调查",capacity?"资源情景：调查与订单批量导出共用周提供的单槽 Leader Runtime。":"资源情景：周提供的 Leader Runtime 已离线。")+
  '<div class="tabs">'+button("查看在线争用","capacity")+button("查看 Leader 离线","offline")+'</div>'+
  (capacity?panel("当前资源与队列",'<div class="check"><strong>订单批量导出</strong><span>已领取并开始协调，占用周提供的唯一 Leader 槽位。</span>'+pill("执行中","ok")+'</div><div class="check"><strong>导出兼容性调查</strong><span>前置交付齐备，等待同一 Leader Runtime 释放容量。当前没有开始回执。</span>'+pill("资源排队","warn")+'</div><p>项目负责人可按现有权限调整优先级。只有获得授权且具备能力的替代资源才可接续。</p>'):
  panel("离线期间的工作",'<p>周提供的 Leader Runtime 离线，新的协调动作等待恢复。断联机器上的既有执行结果待核对。订单前后端子项分别使用甲、乙已获准的其他机器，独立 Run 可继续并回报原 Issue。</p><p>若需人工接管，有权成员先核对当前候选、在途 Run 与副作用，再记录接管范围和下一步。恢复联机后，依据最新交接安排决定是否交还。</p>'))+
  panel("业务前置对照",'<p>订单集成子项仍缺前后端的交付结果时，显示“等待前置结果”。即使有空闲 Runtime，集成也须等所需交付齐备。</p>');
  aside.innerHTML='<h2>情景范围</h2>'+dl([["情景类型","独立异常走查"],["工作归属",capacity?"各自的业务 Issue":"原 Issue 与当前交付 Squad"],["中心记录","工作进度、已收回执与交接决定可查看"]]);
}
function render(focus=false){
  if(state.page==="project")project();
  else if(state.page==="order")order();
  else if(state.page==="light")light();
  else condition();
  if(focus)document.getElementById("heading").focus({preventScroll:true});
}
function update(action){
  let message="",navigate=false;
  if(["project","order","light","capacity","offline"].includes(action)){state.openedNotice=null;state.page=action;navigate=true;if(action==="order")state.selected=state.repaired?"C2":"C1";}
  else if(action.startsWith("notice-")){
    const item=visibleNotice(action.slice(7));
    if(!item)return;
    state.read[state.role+"-"+item.id]=true;state.openedNotice=item.id;state.page="order";state.selected=item.candidate;navigate=true;message="通知已读。";
  }
  else if(action==="C1"||(action==="C2"&&state.repaired)){state.openedNotice=null;state.selected=action;}
  else if(action==="repair"&&!state.repaired){state.repaired=true;state.selected="C2";message="已切换到 C2 重验情景。";}
  else if(action==="full"&&state.repaired&&!state.full){state.full=true;state.selected="C2";message="已载入合成证据，当前负责人为林。";}
  else if(action==="return"&&allowedToAccept()&&Object.hasOwn(returnReasons,state.reason)){
    state.returned={member:"lin",candidate:"C2",standard:"D2",criterion:returnCriteria[state.reason],reason:returnReasons[state.reason]};message="退回决定已记录，当前负责人为交付 Squad。";
  }
  else if(action==="accept"&&allowedToAccept()){state.accepted=true;message="林已接受 C2 交付。";}
  else if(action==="createLight"&&state.page==="light"&&!state.lightOwner){state.lightOwner=state.role;message="轻量事项已创建，模拟执行结果已返回。";}
  else if(action==="acceptLight"&&state.page==="light"&&state.role===state.lightOwner&&!state.lightDone){state.lightDone=true;message="已接受文案修改。";}
  render(navigate);
  if(message)document.getElementById("notification").textContent=message;
  if(navigate)window.scrollTo(0,0);
}
document.addEventListener("click",event=>{
  const target=event.target.closest("[data-action]");
  if(target&&!target.disabled)update(target.dataset.action);
});
document.addEventListener("change",event=>{
  if(event.target.id==="return-reason"&&allowedToAccept()){
    state.reason=Object.hasOwn(returnReasons,event.target.value)?event.target.value:"";
    document.querySelector('[data-action="return"]').disabled=!state.reason;
  }
});
document.getElementById("role").addEventListener("change",event=>{state.role=event.target.value;state.openedNotice=null;render();});
document.getElementById("reset").addEventListener("click",()=>{state=initial();document.getElementById("role").value="lin";render(true);document.getElementById("notification").textContent="演练已重置。";});
render();
</script>
</body>
</html>

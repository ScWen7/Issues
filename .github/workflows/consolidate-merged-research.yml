name: Consolidate merged research branches
on:
  push:
    branches: [master]
    paths: ['.github/workflows/consolidate-merged-research.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  consolidate:
    if: github.repository == 'ScWen7/Issues' && github.event.before == 'c1ccd436790bb168880da3a59424194986e48d31'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Remove the verified merged branch references atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          reviewed=()
          leases=()
          refs=()
          open_prs=$(gh api --paginate 'repos/ScWen7/Issues/pulls?state=open&per_page=100' --jq '.[] | .base.ref, .head.ref')
          while read -r branch expected; do
            ref="refs/heads/$branch"
            current=$(git ls-remote --refs origin "$ref" | cut -f1)
            test "$current" = "$expected"
            git merge-base --is-ancestor "$expected" "$GITHUB_SHA"
            if grep -Fxq -- "$branch" <<< "$open_prs"; then
              echo "::error::Open pull request references $branch"
              exit 1
            fi
            reviewed+=("$branch")
            leases+=("--force-with-lease=$ref:$expected")
            refs+=(":$ref")
          done <<'BRANCHES'
          research/topic-04-cost-quality-improvement 6b87d4df01cdc8ce04e3fe1ddbbe2f79cbd2aa22
          research/3a-independent-runners 66e7b7843710e723b0c9bfccc0116db2747fad54
          research/3b-asset-release dac2259ef081fd44b743c9632115656086fa70bb
          research/3b-existing-session f95185f776dd528839815b4d732b80273a531c42
          research/3b-host-handoff 83fb81453a6b5be684b1013493c7140c7a8150bd
          research/3b-knowledge-context 37cbcc2adf050b13a5f43d34508816791e837da5
          research/3b-role-composition d4a6ab94d93a58efee3b42c7b5c2107af7dffabc
          BRANCHES
          test "${#refs[@]}" -eq 7
          git push --atomic "${leases[@]}" origin "${refs[@]}"
          for branch in "${reviewed[@]}"; do
            remaining=$(git ls-remote --refs origin "refs/heads/$branch")
            test -z "$remaining"
          done

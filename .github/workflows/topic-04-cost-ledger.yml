name: Topic 04 cost ledger prototype
on:
  push:
    branches: [research/topic-04-cost-quality-improvement]
    paths:
      - .github/workflows/topic-04-cost-ledger.yml
      - prototypes/topic-04/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cost-ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check local Runtime probe syntax
        run: node --check prototypes/topic-04/qoder-sdk-runtime-probe.mjs && node --check prototypes/topic-04/codebuddy-stream-runtime-probe.mjs
      - name: Run deterministic cost ledger cases
        run: node --test prototypes/topic-04/*.test.mjs
